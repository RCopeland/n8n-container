services:
  # --- The Bodyguard (Tailscale) ---
  # Joins the tailnet as "n8n" and serves the UI at
  # https://n8n.tail4fde5e.ts.net via `tailscale serve` (NOT funnel — no
  # public exposure, no published host ports). All other services share this
  # container's network namespace, so they're only reachable over the tailnet
  # (and via loopback to each other).
  tailscale:
    image: tailscale/tailscale:latest
    container_name: n8n-tailscale
    hostname: n8n
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
    volumes:
      - tailscale_data:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  # --- The App (n8n) ---
  # Official image, pinned to the digest the previous deployment ran
  # (n8n 2.28.6) — the n8n_data volume is fully compatible. No custom
  # build: the official base has no package manager, and npm-installed n8n
  # has broken transitive deps, so python scripts run in food-runner instead.
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:f3284c9ad6892dc578dadd506d0969adc28046a5e010cb0c3bc892cae1ef292d
    container_name: n8n
    restart: unless-stopped
    network_mode: service:tailscale
    # MagicDNS (100.100.100.100) — tailnet names like *.tail4fde5e.ts.net
    # only resolve through it; the shared netns' default DNS is plain internet.
    dns:
      - 100.100.100.100
    dns_search:
      - tail4fde5e.ts.net
    environment:
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      # Workflows/credentials — EXTERNAL on purpose: this volume pre-dates
      # this stack (created by the old "neon-crate" deployment) so all
      # existing workflows carry over when migrating.
      - n8n_data:/home/node/.n8n
      # workflow JSONs kept in this repo -> importable via:
      #   docker exec n8n n8n import:workflow --input=/workflows/<file>.json
      - ./workflows:/workflows:ro
    depends_on:
      - tailscale

  # --- The Executor (food automation scripts) ---
  # Python has no place in the node runtime, so the food scripts (sync_tandoor,
  # cart.py) run here, inside the same tailscale netns. n8n triggers them with
  # an HTTP POST to http://127.0.0.1:8731/run (loopback within the netns —
  # nothing published, not reachable from outside).
  food-runner:
    image: python:3-alpine
    container_name: food-runner
    restart: unless-stopped
    network_mode: service:tailscale
    dns:
      - 100.100.100.100
    dns_search:
      - tail4fde5e.ts.net
    volumes:
      - /home/rob/Dev/food:/opt/food
      # rw: cart.py persists refreshed OAuth tokens back into credentials.env
      - /home/rob/.config/kroger:/root/.config/kroger
      - /home/rob/.config/tandoor:/root/.config/tandoor:ro
      - ./food-runner.py:/food-runner.py:ro
    command: ["python3", "/food-runner.py"]
    depends_on:
      - tailscale

# --- Volume Declarations ---
volumes:
  tailscale_data:
  n8n_data:
    external: true
